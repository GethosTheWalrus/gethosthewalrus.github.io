name: Generate OG Pages

on:
  push:
    branches: [main]

jobs:
  build-og-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run generator
        run: node generate-og-pages.js

      - name: Commit OG pages
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add public/blog/*.html
          git commit -m "Add OG pages" || echo "No changes"
          git push
