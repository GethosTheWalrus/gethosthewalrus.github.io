name: Generate OG Pages

on:
  push:
    branches: [main]

jobs:
  build-og-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run OG generator script
        run: node generate-og-pages.js

      - name: Test token authentication
        run: |
          curl -H "Authorization: token ${{ secrets.ACTIONS_PAT }}" https://api.github.com/repos/${{ github.repository }}
      

      - name: Commit and push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
          echo "🔍 BEFORE remote URL:"
          git remote -v
      
          echo "🔧 Setting remote URL to use PAT"
          git remote set-url origin https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}
      
          echo "🔍 AFTER remote URL:"
          git remote -v
      
          git add blog/*.html
          git commit -m "Generate OG pages" || echo "No changes to commit"
          git push origin main
        
      
      