<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Crossword</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://miketoscano.com/mini-crossword/">
    <meta property="og:title" content="Mike's Daily Mini Crossword">
    <meta property="og:description" content="Challenge yourself with Mike's daily mini crossword puzzle. New puzzles every day!">
    <meta property="og:image" content="https://miketoscano.com/mini-crossword/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Mike's Daily Mini Crossword">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://miketoscano.com/mini-crossword/">
    <meta property="twitter:title" content="Mike's Daily Mini Crossword">
    <meta property="twitter:description" content="Challenge yourself with Mike's daily mini crossword puzzle. New puzzles every day!">
    <meta property="twitter:image" content="https://miketoscano.com/mini-crossword/og.png">
    <meta property="twitter:image:alt" content="Mike's Daily Mini Crossword">
    
    <!-- Additional Meta Tags -->
    <meta name="description" content="Challenge yourself with Mike's daily mini crossword puzzle. New puzzles every day!">
    <meta name="keywords" content="crossword, puzzle, daily, brain teaser, word game, mini crossword">
    <meta name="author" content="Mike">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="toast-container">
            <div class="status-message" id="status-message"></div>
        </div>
        
        <main>
            <div class="puzzle-container">
                <div class="timer-container">
                    <div id="timer-display">00:00</div>
                </div>
                
                <div class="header-section">
                    <div class="header-title">
                        <h1>Mini Crossword</h1>
                        <div class="seed-info">
                            <span id="current-seed"></span>
                        </div>
                    </div>
                    <div class="controls">
                        <button id="new-puzzle" class="icon-button" title="Generate a new random puzzle">
                            <span class="icon">🔄</span>
                            <span class="label">New Puzzle</span>
                        </button>
                        <button id="share-puzzle" class="icon-button" title="Share this puzzle with others">
                            <span class="icon">📤</span>
                            <span class="label">Share</span>
                        </button>
                        <button id="check-puzzle" class="icon-button" title="Check your answers">
                            <span class="icon">✓</span>
                            <span class="label">Check</span>
                        </button>
                        <button id="reveal-puzzle" class="icon-button" title="Show the complete solution">
                            <span class="icon">💡</span>
                            <span class="label">Reveal</span>
                        </button>
                        <button id="clear-puzzle" class="icon-button" title="Clear all entered letters">
                            <span class="icon">🧹</span>
                            <span class="label">Clear</span>
                        </button>
                    </div>
                </div>
                
                <div class="focused-clue-section" id="focused-clue-section">
                    <!-- Focused clue will be dynamically inserted here -->
                </div>
                
                <div id="crossword-grid" class="crossword-grid"></div>
                
                <div class="clues-container">
                    <div class="clues-section">
                        <h3>Across</h3>
                        <ul id="across-clues" class="clues-list"></ul>
                    </div>
                    <div class="clues-section">
                        <h3>Down</h3>
                        <ul id="down-clues" class="clues-list"></ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="crossword-generator.js"></script>
    <script src="app.js"></script>
</body>
</html>
