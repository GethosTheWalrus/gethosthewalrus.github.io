<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Mike Toscano | Blog</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="dark">
        <meta name="supported-color-schemes" content="dark">
        <meta property="og:title" content="Mike Toscano | Blog" />
        <meta property="og:description" content="Learn about tech and software engineering with Mike Toscano" />
        <meta property="og:url" content="https://miketoscano.com/blog/?post='+post+'" />
        <script defer src="https://cloud.umami.is/script.js" data-website-id="cf643791-8062-46fd-a72d-ea7b042f3f51"></script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
        <script src="/js/svg-pan-zoom-init.js"></script>
        <link rel="stylesheet" href="/css/style.css" />
        <script>
          const urlParams = new URLSearchParams(window.location.search);
          const post = urlParams.get('post');
          let meta = document.createElement('meta');
          meta.setAttribute('property', 'og:image');
          meta.setAttribute('content', '/img/blog/'+post+'.png');
          document.getElementsByTagName('head')[0].appendChild(meta);
          document.addEventListener("DOMContentLoaded", function(event){
            document.getElementById('post').setAttribute('src', post+'.md');
            document.getElementById('header-image').setAttribute('src', '/img/blog/'+post+'.png')
          });
        </script>
    </head>
    <body>
      <div id="bar">
        <div id="red">
        </div>
        <div id="yellow">
        </div>
        <div id="green">
        </div>
        <div id="terminal-title">
            MIKE TOSCANO - ENGINEERING LEADER
        </div>
    </div>
    <div id="tabbar">
        <div onclick="window.location.href='https://miketoscano.com'" class="tab"><div class="innertab">About Mike</div></div><div  class="tab active"><div class="innertab">Blog</div></div><div class="tab"><div onclick="window.location.href='/?tab=games'" class="innertab">Games</div></div>
    </div>
    <div id="blog" class="screen active">
        <div class="innerscreen" style="padding:15px;">
          <div style="margin:0 auto;width:90%;">
            <div class="article-img-container">
              <img id="header-image" src="#" />
            </div>
            <div style="height:150;padding:15px">
              <img style="display:inline-block;border-radius:50px;width: 100px;" src="/img/blog/Captain-headshot-Michael-Toscano.avif" />
              <div style="display:inline-block;vertical-align:top;padding-top:25px;padding-left:5px;">
                <p style="margin:0;color:white;font-size:24px;font-weight:bold;">Mike Toscano</p>
                <p style="margin:0;color:white;opacity:0.5;font-size:16px">&#128011; Docker Captain | Engineering Leader | Open-Source Enthusiast</p>
              </div>
            </div>
            <zero-md id="post" src="loading.md">
                <template data-append>
                    <style>
                      /* Force dark color scheme and set up proper dark theme defaults */
                      :root {
                        color-scheme: dark;
                        /* Define dark theme color variables */
                        --text-color: #ffffff;
                        --background-color: #404040;
                        --code-background: #202020;
                        --link-color: #4a9eff;
                        --border-color: #555555;
                      }
                      
                      /* Set default text color for the entire content area */
                      * {
                        color: var(--text-color);
                      }
                      
                      /* Override browser defaults for common elements */
                      body, html {
                        background-color: var(--background-color);
                        color: var(--text-color);
                      }
                      
                      div {
                        max-width: 800px;
                        margin: 0 auto !important;
                      }
                      
                      p {
                        font-size: 20px;
                        text-align: justify;
                        color: var(--text-color);
                      }
                      
                      /* Headers */
                      h1, h2, h3, h4, h5, h6 {
                        color: var(--text-color);
                      }
                      
                      /* Links */
                      a {
                        color: var(--link-color);
                      }
                      
                      /* Horizontal rules */
                      hr {
                        border-color: var(--link-color);
                        background-color: var(--link-color);
                      }
                      
                      /* Lists */
                      ul, ol, li {
                        color: var(--text-color);
                      }
                      
                      /* Tables */
                      table, th, td {
                        color: var(--text-color);
                        border-color: var(--border-color);
                      }
                      
                      /* Blockquotes */
                      blockquote {
                        color: var(--text-color);
                        border-left-color: var(--border-color);
                      }
                      
                      /* Code blocks - preserve syntax highlighting but ensure readable background */
                      code, pre {
                        background-color: var(--code-background) !important;
                        /* Let syntax highlighting handle text colors */
                      }
                      
                      /* Inline code should have light text if no syntax highlighting */
                      code:not(pre code) {
                        color: #e8e8e8;
                      }
                      
                      div:not(.mermaid):not(.mermaid *), p:not(.mermaid):not(.mermaid *) {
                        background: var(--background-color) !important;
                        background-color: var(--background-color) !important;
                      }
                      .mermaid, .mermaid * {
                        background: transparent !important;
                        background-color: transparent !important;
                      }
                      .mermaid .er .entityBox, .mermaid .er .box {
                        fill: #f8f8f8 !important;
                        stroke: #333 !important;
                      }
                      .mermaid .er .label, .mermaid .er .nodeLabel {
                        fill: #333 !important;
                      }
                      .mermaid foreignObject {
                        width: 200px !important;
                        min-width: 200px !important;
                        overflow: visible !important;
                      }
                      .mermaid foreignObject > div {
                        max-width: 200px !important;
                        width: 200px !important;
                        white-space: nowrap !important;
                        overflow: visible !important;
                      }
                      .mermaid .nodeLabel p {
                        margin: 0 !important;
                        padding: 2px 4px !important;
                        white-space: nowrap !important;
                        font-size: 12px !important;
                      }
                      .blog-content-block {
                        margin: 0 auto !important;
                        text-align: center !important;
                        vertical-align: middle !important;
                        width: 100% !important;
                        padding-bottom: 20px !important;
                      }
                      /* Ensure SVGs can receive mouse events */
                      svg {
                        pointer-events: all !important;
                        user-select: none !important;
                      }
                      .mermaid svg {
                        pointer-events: all !important;
                        cursor: grab !important;
                      }
                      .mermaid svg:active {
                        cursor: grabbing !important;
                      }
                      /* Override any conflicting styles */
                      .mermaid div {
                        pointer-events: none !important;
                      }
                      .mermaid svg * {
                        pointer-events: all !important;
                      }
                    </style>
                </template>
            </zero-md>
          </div>
        </div>
    </div>
    </body>
</html>
